services:
  tarot-mcp:
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN}
      ALLOWED_HOSTS: tarot-mcp,localhost,127.0.0.1

  tunnel-client:
    image: ghcr.io/openai/tunnel-client:v0.0.14
    depends_on:
      tarot-mcp:
        condition: service_healthy
    restart: unless-stopped
    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:?Set CONTROL_PLANE_API_KEY}
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID:?Set CONTROL_PLANE_TUNNEL_ID}
      MCP_SERVER_URL: http://tarot-mcp:3000/mcp
      MCP_AUTHORIZATION: 'Bearer ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN}'
      MCP_EXTRA_HEADERS: 'Authorization: env:MCP_AUTHORIZATION'
      MCP_DISCOVERY_EXTRA_HEADERS: 'Authorization: env:MCP_AUTHORIZATION'
      MCP_STARTUP_WAIT_TIMEOUT: 60s
      HEALTH_LISTEN_ADDR: ':8080'
      LOG_LEVEL: info
      LOG_FORMAT: json
